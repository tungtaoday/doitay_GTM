# ── Content Strategy ──
content_angles:
  - name: "Cái Uy"
    description: "Nâng tầm nghề thợ — thợ giỏi là nghệ nhân, không phải lao động phổ thông"
    examples:
      - "Thợ điện 15 năm: 'Tôi tự hào mỗi khi khách gọi lại lần 2'"
      - "Anh Hùng — từ thợ phụ đến chủ đội 8 người"
    emotion: "Tự hào nghề"

  - name: "Sĩ Diện"
    description: "Có profile đẹp = có mặt mũi với khách. CV thợ chuyên nghiệp."
    examples:
      - "Profile thợ 5 sao vs thợ không có gì — khách chọn ai?"
      - "Bạn có 10 năm kinh nghiệm nhưng khách không biết"
    emotion: "Muốn được nhìn nhận"

  - name: "Cơ Hội"
    description: "Cơ hội việc làm thực tế — số liệu, case study"
    examples:
      - "1,200 khách đã đặt lịch trên Doitay.vn"
      - "Thợ Minh nhận 5 việc/tuần chỉ sau 2 tuần tạo profile"
    emotion: "FOMO — sợ bỏ lỡ"

content_pillars:
  - "Câu chuyện thợ giỏi (Cái Uy — trust building)"
  - "Tips nghề & kinh nghiệm (Education — thu hút thợ)"
  - "Cơ hội việc làm trên Doitay (Cơ Hội — conversion)"
  - "Khách hàng nói gì (Social Proof)"
  - "Behind the scenes — đội ngũ Doitay (Authenticity)"

# ── Tone & Voice ──
tone: >
  Nói chuyện như đồng nghiệp, không phải như công ty.
  Dùng ngôn ngữ thợ: "bơm gas đểu", "thợ đụng", "thợ cỏ", "kèo", "bom kèo".
  KHÔNG dùng giọng doanh nghiệp, KHÔNG dùng buzzword marketing.
  Ấm áp, thực tế, tôn trọng nghề thợ.

avoid:
  - "Giọng bán hàng, quảng cáo lộ liễu"
  - "Ngôn ngữ corporate: 'giải pháp toàn diện', 'nền tảng số'"
  - "So sánh tiêu cực với thợ khác"
  - "Hứa hẹn quá mức ('kiếm triệu mỗi ngày')"

